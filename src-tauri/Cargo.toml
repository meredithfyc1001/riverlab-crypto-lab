[package]
name = "riverlab-6a"
description = "RiverLab Crypto Lab Windows feasibility prototype"
version = "0.6.0-alpha.1"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
tauri = "=2.12.7"
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "=2.7.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
