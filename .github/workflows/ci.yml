name: Project quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check / ${{ matrix.os }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: chromium
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: |
          npm audit
          npm audit --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: npx playwright install chromium
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Independent numerical references
        shell: bash
        run: |
          python tests/reference/legacy_reference_check.py
          python tests/reference/statistics_reference.py --check
          python tests/reference/phase2b_reference.py --check
          python tests/reference/research_reference.py --check
          python tests/reference/replay_reference.py --check
          python tests/reference/risk_reference.py --check
          python tests/reference/rules_reference.py --check
          python tests/reference/portfolio_reference.py --check
          python tests/reference/shared_pool_reference.py --check
          python tests/reference/market_regime_reference.py --check
          python tests/reference/advanced_research_reference.py --check
      - name: Test the independent browser snapshot reader
        run: python -B tests/reference/test_phase6c_bundle.py
      - name: Test independent migration history references
        run: python -B -m unittest discover -s tests/reference -p "test_phase6cb_*.py" -v
      - name: Verify exact 256 MiB migration codec boundary
        run: node scripts/profile-snapshot-codec.mjs
      - run: npm run check
      - name: Profile 50,000 candles in the platform browser
        run: node scripts/profile-backtest.mjs
      - name: Profile two and five assets at the portfolio limit
        run: node scripts/profile-portfolio.mjs
      - name: Profile shared strategies and periodic rebalancing
        run: node scripts/profile-portfolio.mjs --shared
      - name: Profile market regimes for single and portfolio experiments
        run: node scripts/profile-market-regime.mjs
      - name: Profile CSV, storage and transfer capacity in the platform browser
        run: node scripts/profile-capacity.mjs
      - name: Read-only formatting diagnostics
        if: failure()
        run: node scripts/format-diagnostics.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            work/phase-6c-a/
            work/phase-6c-b/
          retention-days: 14

  migration:
    name: Isolated migration / ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            project: chromium-linux
          - os: macos-latest
            browser: chromium
            project: chromium-darwin
          - os: windows-latest
            browser: chrome
            project: chrome-win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: work/quality
      - name: Select the native Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Reconcile archives, exercise the actual Repository and recover from faults
        shell: bash
        run: |
          set -eu
          sample="work/quality/work/phase-6c-b/$PROJECT"
          prior="work/quality/work/phase-6c-a/$PROJECT"
          read_sha() { node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).fileSha256" "$1/browser-receipt.json"; }
          out=work/migration-evidence
          mkdir "$out"
          python -B scripts/phase6c/migrate_candidate.py "$sample/synthetic-versions.riverlab-migration" --sha256 "$(read_sha "$sample")" --candidate-dir "$out/candidate"
          cargo +1.100.0 run --quiet --locked --manifest-path src-tauri/Cargo.toml --example verify_migration -- "$out/candidate/research.sqlite" "$out/candidate/reference.json" > "$out/repository.json"
          python -B tests/reference/test_phase6cb_faults.py --snapshot "$prior/synthetic-full.riverlab-migration" --sha256 "$(read_sha "$prior")" --report "$out/faults.json"
      - name: Build and exercise the extracted Windows isolated test kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sample = "work/quality/work/phase-6c-b/$env:PROJECT"
          $out = 'work/migration-evidence/kit'
          python -B scripts/phase6c/package_test_kit.py build --archive "$sample/synthetic-versions.riverlab-migration" --receipt "$sample/browser-receipt.json" --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive (Get-ChildItem "$out/*.zip").FullName -DestinationPath 'work/独立 测试'
          & 'work/独立 测试/run-isolated.cmd'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: work/migration-evidence/
          retention-days: 14

  local-test-package:
    name: Windows local test ZIP / Chrome + Edge
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:local
      - name: Verify extracted ZIP with Windows Chrome
        run: npm run test:package
        env:
          E2E_BROWSER: chrome
      - name: Verify extracted ZIP with Windows Edge
        run: npm run test:package
        env:
          E2E_BROWSER: msedge
      - name: Record source SHA
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Upload verified Windows local test package (14 days)
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: RiverLab-Crypto-Lab-Local-Test-${{ steps.source.outputs.sha }}
          path: |
            work/local-package/RiverLab-Crypto-Lab-Local-Test.zip
            work/local-package/RiverLab-Crypto-Lab-Local-Test.zip.sha256
            work/local-package/package-*-evidence.json
            work/local-package/package-*.png
            work/local-package/snapshot-*/
          if-no-files-found: error
          retention-days: 14
      - name: Publish package identity and download link
        shell: pwsh
        env:
          PACKAGE_URL: ${{ steps.package.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          $build = Get-Content -Raw work/local-package/RiverLab-Crypto-Lab-Local-Test/build-info.json | ConvertFrom-Json
          $zip = Get-FileHash work/local-package/RiverLab-Crypto-Lab-Local-Test.zip -Algorithm SHA256
          @(
            "[$($build.product) $($build.version) Windows ZIP]($env:PACKAGE_URL)"
            ""
            "- Commit: $($build.commitSha)"
            "- Inner ZIP SHA-256: $($zip.Hash.ToLowerInvariant())"
            "- Actions artifact SHA-256: $env:ARTIFACT_DIGEST"
            "- Retention: 14 days from upload"
          ) >> $env:GITHUB_STEP_SUMMARY

  storage:
    name: Rust SQLite / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select the Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run native repository and service tests
        run: cargo +1.100.0 test --locked --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Verified Windows distribution
    needs: [quality, storage, local-test-package]
    uses: ./.github/workflows/desktop.yml
