name: Windows desktop package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Build and exercise installed desktop
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RIVERLAB_6A_DIST: ${{ github.workspace }}/work/desktop-6a/dist
      RIVERLAB_6A_OUTPUT: ${{ github.workspace }}/work/desktop-6b/evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Select the Windows Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.100.0
      - name: Build the desktop EXE and per-user NSIS installer
        id: build
        run: npm run desktop:build
      - name: Run native SQLite and download checks with the locked graph
        id: native
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
      - name: Pack and install the exact distributed bytes
        id: pack
        run: ./scripts/desktop-package/prepare.ps1
      - name: Open and close the standalone EXE with no Node on PATH
        id: standalone
        run: ./scripts/desktop-package/standalone.ps1
      - name: Exercise installed WebView2 and compare with Edge
        id: verification
        run: |
          # This job uses a disposable hosted runner. Hold our own default-name file
          # open throughout all three installed/Edge runs, including frontend startup.
          $downloads = (New-Object -ComObject Shell.Application).NameSpace('shell:Downloads').Self.Path
          $original = Join-Path $downloads 'riverlab-6a-synthetic-50000.json'
          $guard = [IO.FileStream]::new($original, [IO.FileMode]::CreateNew, [IO.FileAccess]::ReadWrite,
            [IO.FileShare]::None, 4096, [IO.FileOptions]::DeleteOnClose)
          try {
            $marker = [Text.Encoding]::UTF8.GetBytes('pre-existing synthetic file')
            $guard.Write($marker, 0, $marker.Length)
            $guard.Flush()
            node scripts/desktop-6a/verify.mjs
            $verify = $LASTEXITCODE
            $guard.Position = 0
            if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($guard)) -cne
                [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($marker))) {
              throw "Original file changed during acceptance."
            }
            exit $verify
          } finally {
            $guard.Dispose()
          }
      - name: Write Windows evidence and performance summary
        if: always()
        env:
          STAGE_OUTCOMES: >-
            {"build":"${{ steps.build.outcome }}","native":"${{ steps.native.outcome }}",
            "packageAndInstall":"${{ steps.pack.outcome }}","standalone":"${{ steps.standalone.outcome }}",
            "installedAppAndEdge":"${{ steps.verification.outcome }}"}
        run: node scripts/desktop-package/summary.mjs
      - name: Upload Windows measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase-6B-Windows-evidence-${{ env.EXPECTED_SHA }}-${{ github.run_attempt }}
          path: work/desktop-6b/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows acceptance kit
        id: kit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Phase-6B-Windows-x64-${{ steps.verification.outcome }}-${{ env.EXPECTED_SHA }}-${{ github.run_attempt }}
          path: |
            work/desktop-6b/package/*.zip
            work/desktop-6b/package/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Summarize the tested package
        env:
          PACKAGE_URL: ${{ steps.kit.outputs.artifact-url }}
          WRAPPER_DIGEST: ${{ steps.kit.outputs.artifact-digest }}
          EXE_DIGEST: ${{ steps.pack.outputs.exe_sha256 }}
          SETUP_DIGEST: ${{ steps.pack.outputs.setup_sha256 }}
          ZIP_DIGEST: ${{ steps.pack.outputs.archive_sha256 }}
        run: |
          @(
            "[Download Phase 6B Windows acceptance kit]($env:PACKAGE_URL)"
            ""
            "- Source SHA: $env:EXPECTED_SHA"
            "- Standalone EXE SHA-256: $env:EXE_DIGEST"
            "- NSIS installer SHA-256: $env:SETUP_DIGEST"
            "- Inner ZIP SHA-256: $env:ZIP_DIGEST"
            "- Actions artifact SHA-256: $env:WRAPPER_DIGEST"
            "- Windows x64 CI, existing WebView2 runtime, test build. Retained for 14 days."
          ) >> $env:GITHUB_STEP_SUMMARY
